<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat | JobPortal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232563eb' width='100' height='100'/><text x='50' y='65' font-size='50' font-weight='bold' text-anchor='middle' fill='white' font-family='system-ui'>JP</text></svg>">  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/icons.css" />
  <link rel="stylesheet" href="css/global.css">
  <style>
    .ai-chat-container { max-width: 500px; margin: 40px auto; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow-1); padding: 24px; }
    #aiChatBox { height: 320px; overflow-y: auto; background: var(--surface-2); border-radius: 6px; padding: 12px; margin-bottom: 16px; font-size: 1rem; color: var(--text); }
    .chat-msg { margin-bottom: 10px; }
    .user-msg { text-align: right; color: var(--brand); }
    .ai-msg { text-align: left; color: var(--text); }
    .error-msg { color: #b91c1c; }
    #aiChatInput { width: 80%; padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    #aiChatForm button { padding: 8px 16px; border-radius: 4px; background: var(--brand); color: #fff; border: none; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="./index.html" class="logo"><span class="logo-mark" aria-hidden="true">JP</span> JobPortal</a>
    </div>

      <a href="index.html" class="nav-link">Home</a>
      <a href="jobs.html" class="nav-link">Jobs</a>
      <a href="dashboard.html" id="dashboardLink" class="nav-link">Dashboard</a>
      <a href="menu.html" id="menuLink" class="nav-link">Menu</a>
      <a href="profile.html" id="profileLink" class="nav-link">Profile</a>
      <a href="post-jobs.html" id="postJobLink" class="nav-link">Post Job</a>
      <a href="admin.html" id="adminLink" class="nav-link">Admin</a>
      <a href="login.html" id="loginLink" class="nav-link">Login</a>
      <a href="profile.html" class="nav-profile-chip" aria-label="Profile">
        <span class="nav-profile-avatar"><i class="fa-solid fa-user"></i></span>
      </a>
      <button id="themeToggle" class="btn btn-ghost">🌙</button>
      <button id="logoutBtn" class="btn btn-outline">Logout</button>
  </nav>

  <div class="ai-chat-container">
    <h2>AI Chat Assistant</h2>
    <div id="aiChatBox"></div>
    <form id="aiChatForm" autocomplete="off">
      <input id="aiChatInput" type="text" placeholder="Ask me anything..." required />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
